<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows Update</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: none; /* Oculta el cursor para mayor realismo */
        }
        
        #update-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Animación de carga circular oficial de Windows 11 */
        .spinner {
            position: relative;
            width: 60px;
            height: 60px;
            margin-bottom: 35px;
        }
        .spinner .dot {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transform: rotate(225deg);
            animation: spinner-spin 5.5s infinite ease-in-out;
        }
        .spinner .dot::after {
            content: "";
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #ffffff;
        }
        .spinner .dot:nth-child(2) { animation-delay: 240ms; }
        .spinner .dot:nth-child(3) { animation-delay: 480ms; }
        .spinner .dot:nth-child(4) { animation-delay: 720ms; }
        .spinner .dot:nth-child(5) { animation-delay: 960ms; }
        .spinner .dot:nth-child(6) { animation-delay: 1200ms; }

        @keyframes spinner-spin {
            0% { transform: rotate(225deg); opacity: 1; animation-timing-function: ease-out; }
            7% { transform: rotate(345deg); animation-timing-function: linear; }
            30% { transform: rotate(455deg); animation-timing-function: ease-in-out; }
            39% { transform: rotate(690deg); animation-timing-function: linear; }
            70% { transform: rotate(815deg); opacity: 1; animation-timing-function: ease-out; }
            75% { transform: rotate(945deg); animation-timing-function: linear; }
            76% { opacity: 0; transform: rotate(945deg); }
            100% { opacity: 0; transform: rotate(945deg); }
        }

        /* Textos oficiales de la pantalla de carga */
        h1 {
            font-size: 22px;
            font-weight: 350;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }
        p {
            font-size: 14px;
            color: #eeeeee;
            font-weight: 300;
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>

    <div id="update-container">
        <!-- El cargador circular estilo Windows -->
        <div class="spinner">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        
        <h1>Actualizando tu equipo. Mantén el equipo encendido.</h1>
        <p>Tu PC se reiniciará varias veces. <span id="percentage">0%</span> completado</p>
    </div>

    <script>
        let percent = 0;
        const percentEl = document.getElementById('percentage');

        function updateProgress() {
            // Genera saltos de porcentaje realistas (avanza entre 1% y 3% al azar)
            percent += Math.floor(Math.random() * 3) + 1;
            
            if (percent > 100) {
                // Al llegar a 100%, simula un reinicio falso y vuelve a empezar desde 0% infinitamente
                percent = 0; 
            }
            
            percentEl.innerText = percent + "%";

            // Intervalo de tiempo aleatorio para que parezca que está instalando de verdad
            let nextUpdate = Math.floor(Math.random() * 3000) + 1500; 
            setTimeout(updateProgress, nextUpdate);
        }

        // Bloquear la tecla F11 para dificultar que salgan de pantalla completa fácilmente
        window.addEventListener('keydown', function(e) {
            if (e.key === 'F11' || e.keyCode === 122) {
                e.preventDefault();
            }
        });

        // Inicia el contador cíclico infinito
        setTimeout(updateProgress, 2000);
    </script>
</body>
</html>
