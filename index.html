<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows Update</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: none;
        }
        
        #update-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .spinner {
            position: relative;
            width: 60px;
            height: 60px;
            margin-bottom: 35px;
        }
        .spinner .dot {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transform: rotate(225deg);
            animation: spinner-spin 5.5s infinite ease-in-out;
        }
        .spinner .dot::after {
            content: "";
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #ffffff;
        }
        .spinner .dot:nth-child(2) { animation-delay: 240ms; }
        .spinner .dot:nth-child(3) { animation-delay: 480ms; }
        .spinner .dot:nth-child(4) { animation-delay: 720ms; }
        .spinner .dot:nth-child(5) { animation-delay: 960ms; }
        .spinner .dot:nth-child(6) { animation-delay: 1200ms; }

        @keyframes spinner-spin {
            0% { transform: rotate(225deg); opacity: 1; animation-timing-function: ease-out; }
            7% { transform: rotate(345deg); animation-timing-function: linear; }
            30% { transform: rotate(455deg); animation-timing-function: ease-in-out; }
            39% { transform: rotate(690deg); animation-timing-function: linear; }
            70% { transform: rotate(815deg); opacity: 1; animation-timing-function: ease-out; }
            75% { transform: rotate(945deg); animation-timing-function: linear; }
            76% { opacity: 0; transform: rotate(945deg); }
            100% { opacity: 0; transform: rotate(945deg); }
        }

        h1 {
            font-size: 22px;
            font-weight: 350;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }
        p {
            font-size: 14px;
            color: #eeeeee;
            font-weight: 300;
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>

    <div id="update-container">
        <div class="spinner">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        
        <h1>Updating your device. Please keep your computer on.</h1>
        <p>Your PC will restart several times. <span id="percentage">0%</span> complete</p>
    </div>

    <script>
        let percent = 0;
        const percentEl = document.getElementById('percentage');

        function updateProgress() {
            percent += Math.floor(Math.random() * 3) + 1;
            
            if (percent > 100) {
                percent = 0; 
            }
            
            percentEl.innerText = percent + "%";

            let nextUpdate = Math.floor(Math.random() * 3000) + 1500; 
            setTimeout(updateProgress, nextUpdate);
        }

        window.addEventListener('keydown', function(e) {
            if (e.key === 'F11' || e.keyCode === 122) {
                e.preventDefault();
            }
        });

        setTimeout(updateProgress, 2000);
    </script>
</body>
</html>
